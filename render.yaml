services:
  - type: web
    name: pashuraksha-ai-backend
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: EXTRA_CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
